name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m unittest discover -v
      - run: docker build -t platform-app:${{ github.sha }} .

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.21.3}
      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          setup-tools: kubeconform
          kubeconform: "0.8.0"
      - run: helm lint helm/platform-app
      - run: helm template platform-app helm/platform-app -f environments/dev.yaml | kubeconform -strict -summary
      - run: helm template platform-app helm/platform-app -f environments/prod.yaml --set serviceMonitor.enabled=false | kubeconform -strict -summary

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.9.8"}
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
